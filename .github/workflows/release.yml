name: release

# FIRES ONLY ON A VERSION TAG — the release act, gated on the maintainer's
# express word (push `vX.Y.Z`). Inert until then. Requires repo secrets:
#   CARGO_REGISTRY_TOKEN  (crates.io)
#   PYPI_API_TOKEN        (PyPI)
# Node (npm) + Go are released per RELEASING.md (napi flow / git tag) — not wired
# here yet because the napi multi-platform matrix needs a verified dry-run first.
# ALWAYS push a pre-release tag (e.g. v0.1.0-rc.1) and confirm green before the
# real tag. See RELEASING.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish lagom-core to crates.io
        run: cargo publish -p lagom-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: build wheels (manylinux/macos/windows)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/lagom-py/Cargo.toml -o dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  python-publish:
    needs: python-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: publish wheels to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
