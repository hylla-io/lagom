name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repo. Release publishing lives in
# release.yml with its own scoped permissions.
permissions:
  contents: read

jobs:
  # Supply-chain gate: RustSec advisories, license allowlist, duplicate-version
  # and registry-source policy (deny.toml) for the Rust workspace, plus
  # govulncheck over the Go binding modules.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: govulncheck (go binding + examples)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd go && govulncheck ./...)
          (cd go/examples && govulncheck ./...)

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: just ci
        run: just ci

  # End-to-end: the shipped CLI wrapping a REAL foreign MCP server (the Node
  # fixture bin/fast-mcp.js) over real process stdio. Node ships on the runner.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: just e2e
        run: just e2e

  # The Python binding (lagom-py) is excluded from the workspace `just ci` gate
  # because its pyo3 extension-module cdylib needs a Python interpreter to link
  # (root Cargo.toml / justfile). This job gates it separately so a pyo3
  # regression fails CI: fmt-check + clippy (`just py-check`), the binding's Rust
  # unit tests (`just py-test`), and a maturin wheel build + Python smoke test
  # (`just py`).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: astral-sh/setup-uv@v8.2.0
      - name: install maturin
        run: uv tool install maturin
      - name: just py-check
        run: just py-check
      - name: just py-test
        run: just py-test
      - name: just py
        run: just py

  # The Node/TypeScript binding (lagom-node) is likewise excluded from the
  # workspace gate: it is a napi-rs cdylib (`.node` addon) built by the napi CLI,
  # not by `cargo build --all`. This job gates it separately so a napi regression
  # fails CI: fmt-check + clippy on the library surface (`just node-check`), then a
  # napi build + Node smoke test (`just node-test`) that imports the addon and
  # asserts project() drops a tool + pins/hides an arg and rewrite() rejects an
  # out-of-enum call — the same parity contract as the Python smoke test.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
      - name: just node-check
        run: just node-check
      - name: just node-test
        run: just node-test

  # The wasm/Go face (lagom-wasm + go/) is also outside the workspace gate:
  # lagom-wasm targets wasm32 (its memory ABI is only meaningful there) and the
  # Go module runs the embedded blob via wazero. This job rebuilds the wasm
  # (refreshing the committed blob), then runs the Go tests against that freshly
  # built blob under CGO_ENABLED=0 — so a lagom-core change that alters wasm
  # behavior is caught, and the go-get-clean (no-cgo) guarantee is enforced by
  # the test path itself.
  wasm-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: build wasm + refresh embedded blob
        run: just wasm
      - name: go tests (CGO-free)
        run: just go-test
      - name: mcp-go consumption examples (CGO-free)
        run: just examples

  # Cross-binding parity (the NO-DRIFT guard): runs the SAME fixture suite through
  # all four faces (rust / go-via-wasm / python / node) and asserts byte-identical
  # output. A behavior change that lands in one binding but not the others fails
  # here. Needs every toolchain, so it is its own job.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: install maturin
        run: uv tool install maturin
      - name: just parity
        run: just parity
