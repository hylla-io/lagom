[package]
name = "lagom-cli"
description = "The lagom CLI: stdio proxy, harness-snippet emit, policy validation, and skill emit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lagom"
path = "src/main.rs"

[dependencies]
lagom-audit = { workspace = true }
lagom-config = { workspace = true }
lagom-proxy = { workspace = true }
# End product: exact pins, equal to Cargo.lock. The workspace table holds the
# library floors, and `workspace = true` cannot narrow a version.
clap = { version = "=4.6.7", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["full"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
tempfile = "=3.27.0"
