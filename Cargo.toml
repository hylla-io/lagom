[workspace]
members = [
    "crates/lagom-core",
    "crates/lagom-config",
    "crates/lagom-audit",
    "crates/lagom-proxy",
    "crates/lagom-cli",
]
# lagom-py is a pyo3 cdylib (extension-module): linking it into a plain
# `cargo build --all` would need a Python interpreter to link against and would
# break the `just ci` gate on machines/CI without one. It is therefore EXCLUDED
# from the default workspace build and built separately via `just py` (maturin).
# lagom-wasm targets wasm32 only (built via `just wasm`); lagom-node is a napi-rs
# cdylib (`.node` addon) built by the napi CLI (`just node-build`) — both are
# likewise excluded so `cargo build --all` / `just ci` stay green without their
# extra toolchains.
exclude = ["crates/lagom-py", "crates/lagom-wasm", "crates/lagom-node"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/hylla-io/lagom"
rust-version = "1.96"

[workspace.dependencies]
# Path deps carry an explicit version so every crate in the chain is
# publishable to crates.io (cargo strips the path and keeps the version).
lagom-core = { path = "crates/lagom-core", version = "0.1.2" }
lagom-config = { path = "crates/lagom-config", version = "0.1.2" }
lagom-audit = { path = "crates/lagom-audit", version = "0.1.2" }
lagom-proxy = { path = "crates/lagom-proxy", version = "0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
# 0.29+ required: fixes two RustSec advisories exposed in earlier lines.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# Dev-build debuginfo trim (Cargo build-performance guide): line-tables-only keeps
# file:line backtraces, deps get none; full-debug opt-in via --profile debugging.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
