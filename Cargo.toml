[workspace]
members = [
    "crates/lagom-core",
    "crates/lagom-config",
    "crates/lagom-audit",
    "crates/lagom-proxy",
    "crates/lagom-cli",
]
# lagom-py is a pyo3 cdylib (extension-module): linking it into a plain
# `cargo build --all` would need a Python interpreter to link against and would
# break the `just ci` gate on machines/CI without one. It is therefore EXCLUDED
# from the default workspace build and built separately via `just py` (maturin).
# lagom-wasm targets wasm32 only (built via `just wasm`); lagom-node is a napi-rs
# cdylib (`.node` addon) built by the napi CLI (`just node-build`) — both are
# likewise excluded so `cargo build --all` / `just ci` stay green without their
# extra toolchains.
exclude = ["crates/lagom-py", "crates/lagom-wasm", "crates/lagom-node"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hylla-io/lagom"
rust-version = "1.96"

[workspace.dependencies]
# Path deps carry an explicit version so every crate in the chain is
# publishable to crates.io (cargo strips the path and keeps the version).
lagom-core = { path = "crates/lagom-core", version = "0.1.0" }
lagom-config = { path = "crates/lagom-config", version = "0.1.0" }
lagom-audit = { path = "crates/lagom-audit", version = "0.1.0" }
lagom-proxy = { path = "crates/lagom-proxy", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
