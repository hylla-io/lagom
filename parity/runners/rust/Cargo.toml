# Parity runner for the Rust core face (the canonical reference). Standalone
# crate (NOT a workspace member) so the NO-DRIFT guard builds against the same
# lagom-core every other face embeds, without touching the shipped workspace.
[package]
name = "lagom-parity-rust"
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "lagom-parity-rust"
path = "main.rs"

[dependencies]
lagom-core = { path = "../../../crates/lagom-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone crate: an empty [workspace] table detaches it from the root cargo
# workspace so the parity guard never alters the shipped workspace membership.
[workspace]
